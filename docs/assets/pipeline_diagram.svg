<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1218" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A212E" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1217" />
      <stop offset="100%" stop-color="#1A0D10" />
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2E1A" />
      <stop offset="100%" stop-color="#091C10" />
    </linearGradient>
    <filter id="pGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#pipeBg)" rx="16" />

  <!-- Title -->
  <text x="50" y="50" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">VOX STUDIO — 11-STAGE RESTORATION ARCHITECTURE</text>
  <text x="50" y="75" fill="#8F9CAE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">High-Fidelity Hybrid Neural &amp; DSP Audio Reconstruction Flow</text>

  <!-- COLUMN 1: Ingestion & Time-Domain Repair -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="260" height="540" rx="12" fill="#111620" stroke="#222B3A" stroke-width="1.5" />
    <text x="20" y="32" fill="#00E5FF" font-family="monospace" font-size="13" font-weight="700">STAGE 1 — 5: PRE-PROCESSING</text>
    <line x1="20" y1="44" x2="240" y2="44" stroke="#222B3A" stroke-width="1" />

    <!-- 1. Input -->
    <rect x="15" y="60" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="86" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">1. Raw Audio Diagnosis</text>
    <text x="28" y="106" fill="#8F9CAE" font-family="sans-serif" font-size="11">Welch PSD, SNR &amp; Crest Analysis</text>

    <!-- 2. De-Hum -->
    <rect x="15" y="145" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="171" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">2. De-Hum &amp; Notch</text>
    <text x="28" y="191" fill="#8F9CAE" font-family="sans-serif" font-size="11">50/60 Hz Mains Harmonic Filter</text>

    <!-- 3. De-Clip -->
    <rect x="15" y="230" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="256" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">3. De-Clip Crest Repair</text>
    <text x="28" y="276" fill="#8F9CAE" font-family="sans-serif" font-size="11">Cubic Spline Waveform Reconstruction</text>

    <!-- 4. De-Click -->
    <rect x="15" y="315" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="341" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">4. De-Click &amp; De-Pop</text>
    <text x="28" y="361" fill="#8F9CAE" font-family="sans-serif" font-size="11">MAD Residuals &amp; Hermite Fitting</text>

    <!-- 5. De-Plosive -->
    <rect x="15" y="400" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="426" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">5. Dynamic Plosive Attenuator</text>
    <text x="28" y="446" fill="#8F9CAE" font-family="sans-serif" font-size="11">120 Hz Wind Burst Transient Filter</text>
  </g>

  <!-- COLUMN 2: Hybrid Neural Core & Air Preservation -->
  <g transform="translate(350, 110)">
    <rect x="0" y="0" width="300" height="540" rx="12" fill="#160D10" stroke="#4A1820" stroke-width="1.5" />
    <text x="20" y="32" fill="#FF1744" font-family="monospace" font-size="13" font-weight="700">STAGE 6: HYBRID NEURAL CORE</text>
    <line x1="20" y1="44" x2="280" y2="44" stroke="#4A1820" stroke-width="1" />

    <!-- Crossover Split -->
    <rect x="20" y="60" width="260" height="65" rx="8" fill="url(#aiCardGrad)" stroke="#FF1744" stroke-opacity="0.4" filter="url(#pGlow)"/>
    <text x="35" y="86" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Linkwitz-Riley 7.6 kHz Split</text>
    <text x="35" y="106" fill="#FF8A80" font-family="sans-serif" font-size="11">Zero-Phase 4th Order Crossover Filter</text>

    <!-- Dual Paths -->
    <!-- Low-Mid Neural Path -->
    <rect x="20" y="155" width="260" height="135" rx="8" fill="#1F0F13" stroke="#801524" stroke-dasharray="4,4" />
    <text x="32" y="180" fill="#FFD600" font-family="monospace" font-size="11" font-weight="700">LOW/MID BAND (&lt; 7.6 kHz)</text>
    <text x="32" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">GTCRN Neural Denoiser</text>
    <text x="32" y="225" fill="#B0BEC5" font-family="sans-serif" font-size="11">Glance &amp; Gaze Targeted Recurrent Net</text>
    <text x="32" y="245" fill="#00E676" font-family="monospace" font-size="11">ONNX Runtime • RTF 0.086 (11.7x)</text>
    <text x="32" y="268" fill="#8F9CAE" font-family="sans-serif" font-size="11">16 kHz Resample &amp; Polyphase Upsample</text>

    <!-- Air Band Path -->
    <rect x="20" y="315" width="260" height="95" rx="8" fill="#0E1825" stroke="#1E3A5F" />
    <text x="32" y="340" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">AIR BAND (&gt; 7.6 kHz)</text>
    <text x="32" y="365" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Pure Harmonic Vocal Air</text>
    <text x="32" y="388" fill="#90CAF9" font-family="sans-serif" font-size="11">100% Preserved • Eliminates "Underwater" sound</text>

    <!-- Spectral Blend -->
    <rect x="20" y="440" width="260" height="65" rx="8" fill="url(#aiCardGrad)" stroke="#FF1744" stroke-opacity="0.5" filter="url(#pGlow)"/>
    <text x="35" y="466" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Phase-Aligned Spectral Blend</text>
    <text x="35" y="486" fill="#FF8A80" font-family="sans-serif" font-size="11">Cleaned Lows + Master High Air</text>
  </g>

  <!-- COLUMN 3: Post-Processing & Mastering -->
  <g transform="translate(690, 110)">
    <rect x="0" y="0" width="260" height="540" rx="12" fill="#111620" stroke="#222B3A" stroke-width="1.5" />
    <text x="20" y="32" fill="#00E676" font-family="monospace" font-size="13" font-weight="700">STAGE 7 — 11: MASTERING</text>
    <line x1="20" y1="44" x2="240" y2="44" stroke="#222B3A" stroke-width="1" />

    <!-- 7. De-Reverb -->
    <rect x="15" y="60" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="86" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">7. Spectral De-Reverb</text>
    <text x="28" y="106" fill="#8F9CAE" font-family="sans-serif" font-size="11">RT60 Decay Tail Suppression</text>

    <!-- 8. Speech Clarity -->
    <rect x="15" y="145" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="171" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">8. Speech Clarity Engine</text>
    <text x="28" y="191" fill="#8F9CAE" font-family="sans-serif" font-size="11">4-Band Voicing Contour</text>

    <!-- 9. De-Esser & Comp -->
    <rect x="15" y="230" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="256" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">9. De-Esser &amp; Dynamics</text>
    <text x="28" y="276" fill="#8F9CAE" font-family="sans-serif" font-size="11">5.5–9.5 kHz Sibilance Tamer</text>

    <!-- 10. Normalizer -->
    <rect x="15" y="315" width="230" height="65" rx="8" fill="url(#cardGrad)" stroke="#2B3648" filter="url(#pGlow)"/>
    <text x="28" y="341" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">10. BS.1770-4 Normalizer</text>
    <text x="28" y="361" fill="#8F9CAE" font-family="sans-serif" font-size="11">-16 LUFS (or -20 ACX / -23 EBU)</text>

    <!-- 11. Limiter -->
    <rect x="15" y="400" width="230" height="65" rx="8" fill="url(#outGrad)" stroke="#00E676" stroke-opacity="0.6" filter="url(#pGlow)"/>
    <text x="28" y="426" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">11. Lookahead Peak Limiter</text>
    <text x="28" y="446" fill="#A5D6A7" font-family="sans-serif" font-size="11">-1.0 dBFS (or -3.0 dBFS ACX) Ceiling</text>

    <!-- Master Deliverable Tag -->
    <rect x="15" y="485" width="230" height="35" rx="6" fill="#00E676" fill-opacity="0.1" stroke="#00E676" stroke-width="1" />
    <text x="35" y="507" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700">24-bit WAV / 320k MP3 / FLAC Master</text>
  </g>
</svg>
