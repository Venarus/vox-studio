<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="60%" stop-color="#D50000" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#FF8A80" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#logoBg)" stroke="#222834" stroke-width="3" />
  
  <!-- Outer Glowing Accent Ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#crimsonGrad)" stroke-width="2.5" opacity="0.3" filter="url(#logoGlow)" />
  <circle cx="128" cy="128" r="82" fill="#181D26" stroke="#2B3342" stroke-width="2" />

  <!-- Acoustic Waves Left & Right -->
  <g opacity="0.85">
    <!-- Left Waves -->
    <path d="M 68 112 A 20 20 0 0 0 68 144" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 54 100 A 34 34 0 0 0 54 156" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <!-- Right Waves -->
    <path d="M 188 112 A 20 20 0 0 1 188 144" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 202 100 A 34 34 0 0 1 202 156" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Studio Condenser Microphone Core -->
  <g transform="translate(104, 76)">
    <!-- Capsule Body -->
    <rect x="12" y="4" width="24" height="46" rx="12" fill="url(#crimsonGrad)" filter="url(#logoGlow)" />
    <!-- Metallic Grille Texture Lines -->
    <line x1="16" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <line x1="16" y1="22" x2="32" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <line x1="16" y1="30" x2="32" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <!-- U-Shaped Metal Mount Frame -->
    <path d="M 2 28 A 22 22 0 0 0 46 28" fill="none" stroke="#E0E6ED" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stand Neck -->
    <line x1="24" y1="50" x2="24" y2="70" stroke="#E0E6ED" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stand Base Plate -->
    <line x1="12" y1="70" x2="36" y2="70" stroke="#E0E6ED" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Sound Horizon Pulse (Bottom Line) -->
  <line x1="64" y1="188" x2="192" y2="188" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)" />
  <circle cx="128" cy="188" r="3.5" fill="#FF1744" />
</svg>
